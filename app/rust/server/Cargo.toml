[package]
name = "lithium-server"
version = "0.1.0"
edition = "2021"
description = "Lithium backend server — AI proxy, model registry, web proxy, compute"

[dependencies]
lithium-compute = { path = "../lithium-compute" }
axum = { version = "0.7", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
base64 = "0.22"
ring = "0.17"
hostname = "0.4"
futures-util = "0.3"
percent-encoding = "2"
url = "2"
