<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lithium</title>
  <style>
    *{margin:0;box-sizing:border-box}
    body{font:500 15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;background:#0a0a0f;color:#e4e4e7;display:grid;place-items:center;min-height:100vh}
    .card{text-align:center;padding:2.5rem 3rem;background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;max-width:420px}
    h1{font-size:1.6rem;font-weight:700;margin-bottom:.4rem;letter-spacing:-.02em}
    p{color:#a1a1aa;margin-bottom:1.5rem;font-size:.9rem}
    button{background:#6366f1;color:#fff;border:0;padding:.65rem 2rem;border-radius:8px;font:600 .9rem/1 inherit;cursor:pointer;transition:background .15s}
    button:hover{background:#4f46e5}
    .err{color:#f87171;font-size:.8rem;margin-top:1rem;display:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>Lithium</h1>
    <p>Launch in a clean about:blank tab.</p>
    <button id="l">Launch</button>
    <div class="err" id="e">Popups blocked — allow popups and retry.</div>
  </div>
  <script>
    document.getElementById('l').onclick=function(){
      var u=location.origin;
      var w=open('about:blank','_blank');
      if(!w){document.getElementById('e').style.display='block';return}
      with(w.document){
        open();
        write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lithium</title><style>html,body{margin:0;height:100%;width:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe src="'+u+'" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"></iframe></body></html>');
        close();
      }
    };
  </script>
</body>
</html>
