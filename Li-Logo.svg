<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background: graphite squircle -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#313848"/>
      <stop offset="0.55" stop-color="#1A1E28"/>
      <stop offset="1"    stop-color="#0A0C11"/>
    </linearGradient>

    <!-- Top-left sheen -->
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushed silver for the L -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse"
                    x1="148" y1="140" x2="288" y2="372">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DDE4EF"/>
      <stop offset="1"    stop-color="#939FB3"/>
    </linearGradient>

    <!-- DA7756 copper for the i stem -->
    <linearGradient id="copper" gradientUnits="userSpaceOnUse"
                    x1="318" y1="210" x2="364" y2="372">
      <stop offset="0"    stop-color="#F2A98E"/>
      <stop offset="0.5"  stop-color="#DA7756"/>
      <stop offset="1"    stop-color="#A84F33"/>
    </linearGradient>

    <!-- DA7756 dot -->
    <radialGradient id="dot" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0"    stop-color="#F7C2AA"/>
      <stop offset="0.42" stop-color="#DA7756"/>
      <stop offset="1"    stop-color="#9E4526"/>
    </radialGradient>

    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14"
                    flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="1" y="1" width="510" height="510" rx="115"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>

  <!-- "L" in silver -->
  <g filter="url(#lift)" fill="url(#metal)">
    <path d="M148 140 H194 V326 H288 V372 H148 Z"/>
  </g>

  <!-- "i" stem in DA7756 -->
  <g filter="url(#lift)">
    <rect x="318" y="210" width="46" height="162" fill="url(#copper)"/>
  </g>

  <!-- i dot: glow + core in DA7756 -->
  <circle cx="341" cy="164" r="24" fill="#DA7756" opacity="0.8" filter="url(#glow)"/>
  <circle cx="341" cy="164" r="24" fill="url(#dot)"/>
</svg>