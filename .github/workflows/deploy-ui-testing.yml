name: Deploy UI Testing to GitHub Pages

on:
  push:
    branches:
      - 'UI-Testing'
      - 'ui-testing'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-testing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI testing bundle
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Prepare SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to dedicated UI testing Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages-ui-testing
          publish_dir: ./dist
          force_orphan: true
